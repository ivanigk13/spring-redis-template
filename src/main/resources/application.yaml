spring:
  application:
    name: spring-redis
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

is-redis-active: true